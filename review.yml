actions:
  apisYmlCreated: true
  openapiDirectoryCreated: false
  reason: >-
    Prudential plc is recorded as an honest carrier stub with an empty apis[]
    array. No public API, no developer portal, no specification and no ACORD
    reference exists to record, and nothing was fabricated to fill the
    record. The two homonym traps (Prudential Financial US, and the
    M&G-owned UK "Pru" brands) are documented explicitly so downstream
    enrichment and reporting do not attribute another company's API surface
    to this one.
