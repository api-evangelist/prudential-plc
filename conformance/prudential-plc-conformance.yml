    The corporate holding-company domain publishes none.
  artifact: llms/_index.yml
- id: ai-txt
  conforms: false
  evidence: /ai.txt returns HTTP 404 on the corporate host and on all six llms.txt-publishing hosts.
- id: aipref
  conforms: false
  evidence: >-
    No IETF AIPREF signal, Content-Signal header or /.well-known/ preference
