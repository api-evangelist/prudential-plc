    which now returns HTTP 404 (as does /services/sgfindex). SGFinDex is
    Singapore's MAS/GovTech consented financial-data exchange and is the closest
    thing to an open-data regime touching this group, but no live first-party page
    or integration surface was confirmed, so this is recorded as unevidenced
    rather than conformant.
- id: hk-mpf-eMPF
  conforms: false
  evidence: >-
    Prudential Hong Kong administers Mandatory Provident Fund schemes, which are
    being centralised onto the Hong Kong eMPF Platform, but no first-party
    Prudential technical or API description of that integration is published.
- id: responsible-ai-governance
  conforms: true
  evidence: >-
    https://www.prudentialplc.com/en/site-services/responsible-ai-at-prudential/
    publishes five named AI Ethics Principles (Value; Transparency and
    explainability; Fairness; Accountability and responsibility; Compliance),
    states they apply to both first-party and third-party solutions, and names an
    AI Governance Working Group of senior leaders across customer functions,
    operations, data science and risk management performing risk-based evaluation
    of AI initiatives. This is a published governance posture, not a technical
    conformance claim.
certifications:
  published: false
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR certification is
    published on any Prudential plc surface, and no trust centre exists
    (trust.prudentialplc.com and security.prudentialplc.com do not resolve). The
    group's assurance disclosures are regulatory and financial - Hong Kong
    Insurance Authority D-SII designation, group solvency and annual reporting -
    not information-security certifications. No `Compliance` pointer is emitted,
    because there is no published compliance programme to point at.
