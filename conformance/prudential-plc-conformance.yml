note: >-
  No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto document exists for this
  provider, so nothing below is derived from a specification. Every entry is
  anchored to a live probe or to published first-party copy. conforms:false means
  "not evidenced publicly" - it is not an assertion that an internal or
  partner-gated Prudential system fails the standard. Prudential plc's real
  integration channel is bancassurance and tied agency distribution governed by
  commercial contract, which is out of scope for every standard below.
standards:
- id: openapi
  conforms: false
