- id: acord
  conforms: false
  evidence: >-
    No ACORD, AL3, ACORD XML, "ACORD certified", NGDS or ACORD Data Standards
    reference was found on prudentialplc.com, on the group technology strategy
    page, or in any Prudential plc newsroom item. No IVANS, Applied Epic or
    Vertafore reference either - the group writes no US business after the 2021
    Jackson demerger, and IVANS is a US property-and-casualty agency channel.
    ACORD's Life & Annuity and Asia-Pacific standards would be applicable to this
    book, but no first-party evidence of implementation exists.
- id: sgfindex
  conforms: false
  evidence: >-
