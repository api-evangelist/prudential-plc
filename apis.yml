name: Prudential plc
kind: company
description: >-
  Prudential plc is a life and health insurance and asset management group
  incorporated in England and Wales and listed on the London, Hong Kong,
  Singapore and New York exchanges, with its principal operating office in
  Hong Kong and roots in London going back to 1848. Its home market for this
  profile is the United Kingdom, but its book is almost entirely Asian and
  African: life protection, health and medical, savings and retirement,
  takaful, pensions and Hong Kong Mandatory Provident Funds, plus asset
  management under the Eastspring brand, across Hong Kong, Singapore,
  Malaysia, Indonesia, the Philippines, Thailand, Vietnam, Taiwan, India,
  mainland China, Cambodia, Laos, Myanmar and a dozen African markets
  including Kenya, Uganda, Ghana, Nigeria and Zambia. It is no longer a UK
  retail insurer at all - the UK and Europe business was demerged as M&G plc
  in 2019 and the US business as Jackson Financial in 2021 - so the familiar
  UK "Pru" brands at pru.co.uk belong to M&G, not to this company. Its API
  posture is that there is no public API posture. Prudential plc publishes no
  developer portal, no API reference, no downloadable OpenAPI or Swagger
  document and no partner integration surface of any kind: developer,
  developers, docs, api, apis, partners, portal and sandbox subdomains of
  prudentialplc.com all fail to resolve, and /developers, /api, /developer,
  /partners and /integrations on the corporate site all return HTTP 404. The
  group's stated technology strategy is inward-facing - AI, automation, cloud
  and a global AI Lab running over a hundred internal use cases - and its
  distribution is built on tied agency forces and exclusive bancassurance
  partnerships with banks such as Standard Chartered, CIMB, MSB, SeABank,
  Bank Syariah Indonesia and UOB, which are commercial and contractual
  relationships rather than published API programmes. The Pulse by Prudential
  health and wealth app onboards health-tech and wealth-tech partners
  (Babylon, Tictrac, Halodoc, Smarter Health, Prive Technologies, OVO, Google
  Cloud) but every announcement describes the arrangement in commercial
  terms and none exposes a developer programme, SDK or public API. No ACORD,
  AL3, ACORD XML or NGDS reference was found anywhere in Prudential plc's
  public estate. Recorded honestly as a large carrier with a fully
  partner-gated, non-public integration surface. One genuine machine-readable
  surface does exist, and it is not an API: six of the group's market operating
  companies - Prudential Hong Kong, Prudential Singapore, Prudential Indonesia,
  Prudential Vietnam, Pru Life UK in the Philippines and Prudential BSN Takaful
  in Malaysia - publish real first-party llms.txt documents for grounding large
  language models, with Prudential Vietnam declaring a per-user-agent bot access
  policy for gptbot, claudebot, google-extended, perplexitybot and six other
  crawlers. The corporate domain publishes none. Underneath that, the group runs
  a visibly centralised security posture: TLS 1.3 and HSTS on every market host,
  and one shared PowerDMARC/PowerSPF tenant with a common aggregate-report
  mailbox across all seven domains, at p=reject on the corporate domain and
  p=quarantine in the markets, with no CAA record anywhere.
