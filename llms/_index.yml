note: >-
  Prudential plc publishes no API, no developer portal and no llms.txt on the
  corporate domain (www.prudentialplc.com/llms.txt returns HTTP 404). Its
  operating businesses in Asia, however, DO publish real, first-party llms.txt
  files on their consumer domains. Six were harvested verbatim below. This is the
  only machine-readable, agent-facing surface the group publishes anywhere - it
  is content grounding for LLMs, not a programmable interface, and it must not be
  read as evidence of an API. Recorded here because a previous round concluded
  the group had zero machine-readable surface, which was true for APIs and wrong
  for llms.txt.
