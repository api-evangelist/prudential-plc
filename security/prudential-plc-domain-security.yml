group_posture:
  centralised_email_security: true
  evidence: >-
    All seven domains publish an SPF record of the identical shape
    "v=spf1 include:<tenant-hash>.powerspf.com -all" with a hard fail, and all
    seven publish a DMARC record whose aggregate-report address is the SAME
    mailbox, rzrknxeawk@rua.powerdmarc.com, with several also adding a local
    market rua. That is one PowerDMARC tenant administered centrally for the
    whole group rather than seven independently managed estates.
  tls: TLS 1.3 on every host probed; no host fell back below TLS 1.2.
  hsts: HSTS present on every host; six of seven use max-age 31557600 (one year in seconds, Adobe Experience Manager default), Singapore alone uses 31536000 with includeSubDomains and preload.
  dnssec: 1 of 7 domains signed (prudential.co.id).
  caa: 0 of 7 domains publish a CAA record - certificate issuance is unconstrained at DNS level across the entire estate.
  gap: >-
    The clearest actionable gap. Adding CAA records and lifting the market
    domains from p=quarantine to p=reject would cost nothing and would match the
    discipline already demonstrated by the shared SPF/DMARC tenancy.
